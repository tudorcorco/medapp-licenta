{% load static %}
<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificare identitate - MedApp</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">M</div>
            <h1 class="auth-title">Verificare identitate</h1>
            <p class="auth-subtitle">
                Am trimis un cod de 6 cifre la<br>
                <strong style="color:var(--c-primary);">{{ masked_email }}</strong>
            </p>
        </div>

        {% if error %}
        <div style="background:rgba(220,53,69,0.08);border:1.5px solid var(--c-danger);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;">
            <span style="font-size:18px;flex-shrink:0;">⚠️</span>
            <div style="font-size:13px;color:var(--c-danger);font-weight:600;">{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Cod de verificare</label>
                <input
                    type="text"
                    name="code"
                    class="form-input"
                    placeholder="000000"
                    maxlength="6"
                    autocomplete="one-time-code"
                    inputmode="numeric"
                    autofocus
                    style="font-size:28px;font-weight:700;letter-spacing:12px;text-align:center;font-family:monospace;"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
                Verifică codul →
            </button>
        </form>

        <div style="background:var(--surface-2);border-radius:10px;padding:12px 16px;margin-top:16px;font-size:12px;color:var(--text-muted);text-align:center;">
            🔒 Codul este valabil <strong style="color:var(--text);">5 minute</strong>.<br>
            Dacă nu ai primit emailul, verifică folderul Spam.
        </div>

        <div style="text-align:center;margin-top:16px;">
            <a href="{% url 'login' %}" style="font-size:13px;color:var(--text-muted);">← Înapoi la autentificare</a>
        </div>

        <div style="text-align:center;margin-top:16px;">
            <button onclick="toggleTheme()" class="theme-toggle" style="margin:0 auto;" id="theme-toggle-btn" aria-label="Comută tema">🌙</button>
        </div>
    </div>
</div>
</body>
</html>
